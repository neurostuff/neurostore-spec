      required: false
      schema:
        type: string
      description: search for study with specific neurovault id
    is_oa:
      name: is_oa
      in: query
      required: false
      schema:
        type: boolean
    data_sources:
      name: data_sources
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: >-
        include `data_sources`: on an analysis, the data sources linked to it; on a study
        or base study, those of all its analyses. Withheld by default.
    image_metadata:
      name: image_metadata
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 'include each image''s source metadata (the payload it was ingested from). Withheld by default because it is large and unused by most clients; never present in studyset payloads.'
    image_value_summary:
      name: image_value_summary
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 'include each image''s stored value summary (percentiles, spread, histogram, nan/zero/negative counts). Withheld by default; never present in studyset payloads.'
    flat:
      name: flat
      in: query
      required: false
      schema:
        type: boolean
      description: 'do not return any embedded relationships. When set, it is incompatible with nested. '
    info:
      name: info
      in: query
      required: false
      schema:
        type: boolean
      description: show additional for endpoint-object relationships without being fully nested. Incompatible with nested
    gzip:
      name: gzip
      in: query
      required: false
      schema:
        type: boolean
      description: return the content as gzipped content
    journal_id:
      name: journal_id
      in: query
      required: false
      schema:
        type: string
      description: only papers neurostore identified as appearing in this journal
    paginate:
      name: paginate
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: whether to paginate results (true) or return all results at once (false)
  securitySchemes:
    JSON-Web-Token:
      type: http
      scheme: bearer
      description: authentication method
