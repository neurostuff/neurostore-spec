  /analysis-queries/:
    post:
      summary: Select analyses by what their extraction records say
      description: >
        Runs a query over each pipeline analysis's features, read from its paper's latest
        extraction record. Every criterion is optional and criteria combine with AND; a
        list means any of its values, and `or` takes sub-queries. Text criteria match whole
        words, case-insensitively, with `*` for any run of characters and `?` for one; a
        pattern needs three consecutive letters or digits. A normalized criterion
        (medical_condition, task, contrast.key, contrast.set) takes `ids`, the terms a
        normalizer mapped the record's wording to, which match their descendants (a task
        family its tasks, a family its contrast keys and sets) unless `descendants` is
        false, and `text`, a pattern over the wording and the terms' labels; either may
        match. Contrast keys and sets are directional: a term with `:reversed` is the
        contrast stated the other way round. `when_unmapped` decides the analyses whose
        record states the feature but maps none of it, excluded by default; a healthy
        group's condition, or a value read as an absence, is silent. An analysis whose
        record is silent on a criterion does not match
        it unless the criterion says `when_silent: include`. Nothing is stored. The results
        are the studies with a selected analysis, a page at a time as on the list endpoints
        (all of them with `paginate: false`), each with as much as `detail` asks for: its
        selected analyses, how each matched every normalized criterion, and their
        features; with `funnel` the response also says what each criterion dropped. `base_study_ids` or `study_ids` restrict everything to those
        papers or studies, so an empty query with them returns their analyses' features.
      tags:
        - store
        - analyses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/analysis-query-request'
      responses:
        '200':
          description: The selected analyses, and what each criterion dropped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analysis-query-result'
        '400':
          description: >
            The query is not valid. Field error codes: UNKNOWN_FIELD, INVALID_VALUE,
            MISSING_VALUE, and PATTERN_TOO_BROAD for a text pattern without three
            consecutive letters or digits.
  /analysis-terms/:
    get:
      summary: The values an analysis query field takes
      description: >
        Each value of one field across the pipeline analyses' features, with its label,
        parent, children and synonyms and how many analyses and papers carry it, most
        common first. A directional contrast key or set is listed in each direction it
        occurs in.
      tags:
        - store
        - analyses
      parameters:
        - in: query
          name: field
          required: true
          schema:
            type: string
            enum:
              - medical_condition
              - task
              - task_family
              - contrast_key
              - contrast_set
              - contrast_positive_facet
              - contrast_negative_facet
              - arm_kind
              - species
              - spatial_scope
              - measure_type
              - measure_family
              - details_type
              - effect_kind
              - allocation
              - assignment_structure
              - blinding
        - in: query
          name: search
          description: >
            Keep the values whose id, label or a synonym contains this text,
            case-insensitively.
          schema:
            type: string
        - in: query
          name: parent
          description: Keep the values directly under this term.
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: The field's values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analysis-term-list'
  /query/:
    get:
      summary: The datasets a public query reads
      description: >
        Every dataset a public query can read, with its columns, their types, and whether
        each may be grouped and aggregated. A dataset holds public records only and is
        refreshed nightly; `refreshed_at` says when.
      tags:
        - store
        - query
      security:
        - JSON-Web-Token: []
        - {}
      responses:
        '200':
          description: The datasets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/query-dataset-list'
  '/query/{dataset}':
    parameters:
      - schema:
          type: string
        name: dataset
        in: path
        required: true
        description: A dataset named by `GET /query/`.
    get:
      summary: Run an aggregate query over one dataset
      description: >
        A subset of Socrata's SoQL. Each parameter takes an expression over the dataset's
        columns: literals, `= != < <= > >= + -`, `AND OR NOT`, `IS [NOT] NULL`,
        `[NOT] IN (…)`, `BETWEEN … AND …`, `LIKE` and `starts_with(column, 'text')`;
        the aggregates `count(*)`, `count(column)`, `count(distinct column)`, `sum`, `avg`,
        `min` and `max`; and `date_trunc_y`, `date_trunc_ym`, `date_extract_y`, `lower`,
        `upper`, `coalesce` and `case(condition, value, …)`. Nothing else compiles. A
        query whose planned cost exceeds the caller's limit is refused; an API key with
        `read` scope has a higher limit.
      tags:
        - store
        - query
      security:
        - JSON-Web-Token: []
        - {}
      parameters:
        - in: query
          name: $select
          description: Comma-separated expressions, each optionally `AS alias`; `*` for every column.
          schema:
            type: string
        - in: query
          name: $where
          description: A condition over columns; no aggregates.
          schema:
            type: string
        - in: query
          name: $group
          description: Comma-separated columns, expressions or `$select` aliases.
          schema:
            type: string
        - in: query
          name: $having
          description: A condition over aggregates and `$select` aliases.
          schema:
            type: string
        - in: query
          name: $order
          description: Comma-separated expressions or aliases, each optionally `ASC` or `DESC`.
          schema:
            type: string
        - in: query
          name: $limit
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 100
        - in: query
          name: $offset
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - in: query
          name: $q
          description: Words to search for in titles and abstracts, as base-study search reads them; `base-studies` only.
          schema:
            type: string
      responses:
        '200':
          description: The rows
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/query-result'
        '304':
          description: Unchanged since the ETag sent in `If-None-Match`
        '400':
          description: The query does not parse, or names something outside the dataset
        '422':
          description: The query's planned cost exceeds the caller's limit, or it ran past the time limit
        '503':
          description: Too many queries are running; retry after the `Retry-After` header's seconds
