        - $ref: '#/components/parameters/info'
        - $ref: '#/components/parameters/paginate'
      security:
        - JSON-Web-Token: []
        - {}
    post:
      summary: ''
      description: >
        Creates a base study, or returns the active base study one or more of the posted
        identifiers (any bucket) already belong to, adding the identifiers it lacks. When
        the identifiers belong to several active base studies the one holding the strongest
        (version of record doi, pmid, pmcid, then a preprint's, then an alternative; the
        oldest on a tie) is returned, identifiers another base study holds are not taken,
        and the base studies are recorded as merge candidates. A POST is not refused for
        this. A single object is resolved like a list, and a new base study (one object or
        a list) is created with its first version, owned by the caller. Identifiers are
