                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            include_unreviewed was combined with a reviewer or state filter, or a source's
            paper has no article_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/review/base-studies/{id}/assignments':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: The base study (paper).
    get:
      summary: The users a paper is assigned to
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-assignee-list'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404'
  '/review/base-studies/{id}/assignments/{user_id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
        description: The base study (paper).
      - schema:
          type: string
        name: user_id
        in: path
        required: true
        description: The assignee. A reviewer may name only themselves; a lead reviewer may name anyone.
    put:
      summary: Assign a paper to a reviewer, or reassign it
      description: >
        A reviewer assigns a paper to themselves. A lead reviewer (admin-reviewer and admin)
        assigns it to any admin-reviewer. Assigning an already assigned user changes nothing
        and answers 200. The assignee must hold the admin-reviewer role, or the request is
        refused with 422.
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '200':
          description: The user was already assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-assignment'
        '201':
          description: The user was assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-assignment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A reviewer named another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: The assignee does not hold the admin-reviewer role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Release a paper from a reviewer
      description: >
        A reviewer releases their own assignment; a lead reviewer releases anyone's. Releasing
        a user who is not assigned changes nothing and answers 204.
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '204':
          description: The assignment is released, or was not there
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A reviewer named another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404'
  /review/reviewers/:
    get:
      summary: The admin-reviewers, to assign papers to
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-reviewer-list'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /review/me:
    get:
      summary: The caller, as a reviewer
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-me'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /review/imports/:
    post:
      summary: Load the papers of a study_schema layout zip for review
      description: >
        Lead reviewers only (admin-reviewer and admin). Each paper is checked and stored on
        its own: the report names what loaded, what was already loaded and what failed, and
        why. A file that is not a layout is refused whole.
      tags:
        - review
      security:
        - JSON-Web-Token: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A zip of a study_schema layout. The whole request body is at most 200 MiB.
      responses:
        '200':
          description: The report of what each paper did
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-import-report'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body is over 200 MiB
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/422'
  /review/imports/pipeline:
    post:
      summary: Load the records of a pipeline run already in neurostore for review
      description: >
        Lead reviewers only (admin-reviewer and admin). Each record the run stored under the
        config loads with the coordinate parse it read, and with the pipeline's revision when
        it read one. Neurostore keeps no parsed paper or text, so the zip holds each paper's
        parsed paper and text as a study_schema layout; its parses and records are not read.
        A text whose sha256 is not the one the run read fails its paper.
      tags:
        - review
      security:
        - JSON-Web-Token: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - config_id
                - run_id
                - file
              properties:
                config_id:
                  type: string
                  description: The pipeline config whose records to load.
                run_id:
                  type: string
                  description: The run of that config.
                file:
                  type: string
                  format: binary
                  description: A zip of a study_schema layout with each paper's parsed paper and text. The whole request body is at most 200 MiB.
      responses:
        '200':
          description: The report of what each paper did
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/review-import-report'
        '400':
          description: The form has no config_id, run_id or file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The config is unknown, or the run stored no record under it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body is over 200 MiB
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/422'
  '/review/schemas/{name}':
    parameters:
      - schema:
          type: string
        name: name
        in: path
        required: true
        description: extraction-record, coordinate-parse, review-bundle or review-ops
      - schema:
          type: string
        name: If-None-Match
        in: header
        required: false
    get:
      summary: One JSON Schema of the review API
      description: >
        extraction-record and coordinate-parse are the JSON Schemas of the study_schema version
        the server runs, with their description annotations removed (a property named
        description is kept). review-bundle and review-ops are the JSON Schema 2020-12
        contracts of the review bundle and of a batch of review ops, whole. The ETag is a hash
        of the body; a request whose If-None-Match holds it is answered with 304.
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '200':
          description: The JSON Schema
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        '304':
          description: The schema has not changed since the ETag in If-None-Match
          headers:
            ETag:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404'
components:
  schemas:
    review-progress:
      type: object
      description: One reviewer's review of a paper, as the paper list shows it.
      required:
        - user_id
        - user_name
        - state
        - last_seq
        - updated_at
        - edited
        - verified
        - reviewed
        - op_count
        - last_edit_at
      properties:
        user_id:
          type: string
        user_name:
          type: string
          nullable: true
        state:
          $ref: '#/components/schemas/review-state'
        set_aside:
          $ref: '#/components/schemas/review-set-aside'
        last_seq:
          type: integer
        updated_at:
          type: string
          format: date-time
          nullable: true
        edited:
          type: integer
          description: Targets the reviewer edited, added or removed.
        verified:
          type: integer
          description: Targets the reviewer checked and left unchanged.
        reviewed:
          type: integer
          description: Judgeable targets of the source that the reviewer verified, edited, added or removed. Unlike edited and verified, which count every provenance key, this counts only among the source's judgeable targets.
        op_count:
          type: integer
          description: The ops the reviewer has applied to this review.
        last_edit_at:
          type: string
          format: date-time
          nullable: true
          description: When the reviewer last applied an op; null before any.
    review-source:
      type: object
      required:
        - id
        - base_study_id
        - label
        - origin
        - created_at
        - total
        - reviews
        - assignees
      properties:
        id:
          type: string
        base_study_id:
          type: string
        label:
          type: string
          nullable: true
        origin:
          type: string
          description: pipeline_run when the source names a pipeline config and a run, else upload.
          enum:
            - upload
            - pipeline_run
        created_at:
          type: string
          format: date-time
        total:
          type: integer
          description: Targets a reviewer can judge in the source's record, its extracted values and its coordinate parse's analyses.
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/review-progress'
        assignees:
          type: array
          description: The users the paper (base study) is assigned to.
          items:
            $ref: '#/components/schemas/review-assignee'
    review-assignee:
      type: object
      required:
        - user_id
        - name
      properties:
        user_id:
          type: string
        name:
          type: string
          nullable: true
    review-assignee-list:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/review-assignee'
    review-assignment:
      type: object
      required:
        - base_study_id
        - user_id
        - name
        - assigned_by_id
      properties:
        base_study_id:
          type: string
        user_id:
          type: string
        name:
          type: string
          nullable: true
        assigned_by_id:
          type: string
          nullable: true
    review-me:
      type: object
      required:
        - user_id
        - name
        - lead
      properties:
        user_id:
          type: string
        name:
          type: string
          nullable: true
        lead:
          type: boolean
          description: Whether the caller is a lead reviewer (admin-reviewer and admin).
    review-reviewer-list:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/review-assignee'
    review-source-list:
      type: object
      required:
        - metadata
        - results
      properties:
        metadata:
          type: object
          required:
            - total_count
          properties:
            total_count:
              type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/review-source'
    review-import-report:
      type: object
      required:
        - loaded
        - skipped
        - failed
      properties:
        loaded:
          type: array
          items:
            type: object
            required:
              - study_id
              - source_id
              - base_study_id
            properties:
              study_id:
                type: string
              source_id:
                type: string
              base_study_id:
                type: string
        skipped:
          type: array
          items:
            type: object
            required:
              - study_id
              - source_id
              - reason
            properties:
              study_id:
                type: string
              source_id:
                type: string
              reason:
                type: string
        failed:
          type: array
          items:
            type: object
            required:
              - study_id
              - problems
            properties:
              study_id:
                type: string
              problems:
                type: array
                items:
                  type: string
    review-state:
      type: string
      enum:
        - in_progress
        - submitted
        - reference
        - set_aside
    review-set-aside-reason:
      type: string
      description: Why the paper was set aside; other needs a note.
      enum:
        - no_usable_text
        - out_of_scope
        - no_results
        - duplicate
        - other
    review-set-aside:
      type: object
      description: Present only while the review is set aside.
      required:
        - reason
        - note
      properties:
        reason:
          $ref: '#/components/schemas/review-set-aside-reason'
        note:
          type: string
          nullable: true
    review-summary:
      type: object
      required:
        - id
        - source_id
        - user_id
        - state
        - last_seq
        - created_at
        - updated_at
      properties:
        id:
          type: string
        source_id:
          type: string
        user_id:
          type: string
        state:
          $ref: '#/components/schemas/review-state'
        set_aside:
          $ref: '#/components/schemas/review-set-aside'
        last_seq:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    review-detail:
      allOf:
        - $ref: '#/components/schemas/review-summary'
        - type: object
          properties:
            record:
              type: object
              description: The extraction record with the review's ops applied.
            coordinate_revision:
              type: object
              nullable: true
            provenance:
              type: object
            annotations:
              type: object
            ops:
              type: array
              items:
                $ref: '#/components/schemas/review-stored-op'
    review-state-patch:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/review-state'
        reason:
          $ref: '#/components/schemas/review-set-aside-reason'
        note:
          type: string
          maxLength: 10000
    review-bundle:
      type: object
      description: >
        Everything the review app needs to open one paper. Opaque here: its JSON Schema 2020-12
        contract is served at GET /api/review/schemas/review-bundle.
    review-op:
      type: object
      description: >
        One op. Opaque here: it is $defs/Op of the JSON Schema 2020-12 contract served at
        GET /api/review/schemas/review-ops, which the server validates each op against.
    review-stored-op:
      type: object
      description: >
        An applied op as the review stores it: $defs/StoredOp of the contract served at
        GET /api/review/schemas/review-bundle.
        In an op result each one also carries `inverse`, the ops that undo it
        without their client_op_ids, unless it is a note; the
        bundle's stored ops do not.
      properties:
        inverse:
          type: array
          items:
            type: object
            required:
              - type
    review-op-batch:
      type: object
      additionalProperties: false
      required:
        - expected_last_seq
        - ops
      properties:
        expected_last_seq:
          type: integer
          minimum: 0
          description: The review's last_seq the batch was made against.
        ops:
          type: array
          description: >
            The batch's ops, at least and at most as many as the contract served at
            GET /api/review/schemas/review-ops allows.
          items:
            $ref: '#/components/schemas/review-op'
    review-op-result:
      type: object
      required:
        - ops
        - last_seq
        - record
        - coordinate_revision
        - provenance
        - annotations
        - hidden
      properties:
        ops:
          type: array
          items:
            $ref: '#/components/schemas/review-stored-op'
        last_seq:
          type: integer
        record:
          type: object
        coordinate_revision:
          type: object
          nullable: true
        provenance:
          type: object
        annotations:
          type: object
        hidden:
          type: object
          description: The hidden set of the new record, as in the bundle.
        entities:
          type: array
          description: The entity index of the new record, as in the bundle.
          items:
            type: object
    analysis-query-values:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        any:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        all:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        none:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        when_silent:
          $ref: '#/components/schemas/analysis-query-when-silent'
    analysis-query-when-silent:
      type: string
      enum:
        - exclude
        - include
      default: exclude
      description: Whether an analysis whose record says nothing on the criterion matches it.
    analysis-query-text:
      description: A value, a list of values (any of them), or any/all/none lists.
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        - $ref: '#/components/schemas/analysis-query-values'
    analysis-query-strings:
      oneOf:
        - type: string
          minLength: 1
        - type: array
          minItems: 1
          items:
            type: string
            minLength: 1
    analysis-query-terms:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ids:
          $ref: '#/components/schemas/analysis-query-strings'
        text:
          $ref: '#/components/schemas/analysis-query-strings'
    analysis-query-ids:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ids:
          $ref: '#/components/schemas/analysis-query-strings'
    analysis-query-descendants:
      type: boolean
      default: true
      description: Whether an id also matches the terms below it in its vocabulary.
    analysis-query-normalized:
      description: >
        Text (a pattern, or a list of them, any of which may match), or ids and text.
        `ids` and `text` are any-of, and either may match; `all` needs every one and
        `none` refuses each. `when_unmapped` decides an analysis whose record states the
        feature but maps none of it: `exclude` (the default), `include`, or `text`,
        matching it by its wording alone, so a criterion without text excludes it.
      oneOf:
        - $ref: '#/components/schemas/analysis-query-strings'
        - type: object
          additionalProperties: false
          minProperties: 1
          properties:
            ids:
              $ref: '#/components/schemas/analysis-query-strings'
            text:
              $ref: '#/components/schemas/analysis-query-strings'
            all:
              $ref: '#/components/schemas/analysis-query-terms'
            none:
              $ref: '#/components/schemas/analysis-query-terms'
            descendants:
              $ref: '#/components/schemas/analysis-query-descendants'
            when_unmapped:
              type: string
              enum:
                - exclude
                - include
                - text
              default: exclude
            when_silent:
              $ref: '#/components/schemas/analysis-query-when-silent'
    analysis-query-medical-condition:
      description: >
        analysis-query-normalized, and `role` (primary, comorbid, none), which narrows the
        ids to the conditions ns-pond gave that role; a criterion with a role takes ids
        and no text.
      oneOf:
        - $ref: '#/components/schemas/analysis-query-strings'
        - type: object
          additionalProperties: false
          minProperties: 1
          properties:
            ids:
              $ref: '#/components/schemas/analysis-query-strings'
            text:
              $ref: '#/components/schemas/analysis-query-strings'
            all:
              $ref: '#/components/schemas/analysis-query-terms'
            none:
              $ref: '#/components/schemas/analysis-query-terms'
            descendants:
              $ref: '#/components/schemas/analysis-query-descendants'
            role:
              oneOf:
                - type: string
                  enum: [primary, comorbid, none]
                - type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [primary, comorbid, none]
            when_unmapped:
              type: string
              enum:
                - exclude
                - include
                - text
              default: exclude
            when_silent:
              $ref: '#/components/schemas/analysis-query-when-silent'
    analysis-query-normalized-ids:
      description: >
        Ids (an id, or a list of them, any of which may match), as
        analysis-query-normalized without text. An analysis whose record states the
        feature but maps none of it is excluded unless `when_unmapped` is `include`.
      oneOf:
        - $ref: '#/components/schemas/analysis-query-strings'
        - type: object
          additionalProperties: false
          minProperties: 1
          properties:
            ids:
              $ref: '#/components/schemas/analysis-query-strings'
            all:
              $ref: '#/components/schemas/analysis-query-ids'
            none:
              $ref: '#/components/schemas/analysis-query-ids'
            descendants:
              $ref: '#/components/schemas/analysis-query-descendants'
            when_unmapped:
              type: string
              enum:
                - exclude
                - include
              default: exclude
            when_silent:
              $ref: '#/components/schemas/analysis-query-when-silent'
    analysis-query-boolean:
      oneOf:
        - type: boolean
        - type: object
          additionalProperties: false
          required:
            - is
          properties:
            is:
              type: boolean
            when_silent:
              $ref: '#/components/schemas/analysis-query-when-silent'
    analysis-query-range:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        min:
          type: number
        max:
          type: number
        when_silent:
          $ref: '#/components/schemas/analysis-query-when-silent'
    analysis-query-contrast-side:
      description: >
        Criteria on one side of the contrast: what the cells signed onto it carry, through
        their factor levels. `name` is the side's text (its cells' labels or levels and
        their conditions' names); has_patients, has_healthy and medical_condition read the
        side's groups as the top-level criteria read the analysis's; `timepoint` is a
        timepoint's relation_to_intervention, `arm_kind` an arm's kind, and `facet` one of
        the side's contrast-key facets (`valence:negative`, `~wording`, a baseline kind
        such as `fixation`). A text criterion in its place is shorthand for its `name`.
      oneOf:
        - $ref: '#/components/schemas/analysis-query-text'
        - type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              $ref: '#/components/schemas/analysis-query-text'
            has_patients:
              $ref: '#/components/schemas/analysis-query-boolean'
            has_healthy:
              $ref: '#/components/schemas/analysis-query-boolean'
            medical_condition:
              $ref: '#/components/schemas/analysis-query-normalized'
            timepoint:
              $ref: '#/components/schemas/analysis-query-text'
            arm_kind:
              $ref: '#/components/schemas/analysis-query-text'
            facet:
              $ref: '#/components/schemas/analysis-query-text'
    analysis-query:
      type: object
      additionalProperties: false
      description: >
        Criteria on a pipeline analysis. Group criteria (medical_condition, species,
        has_patients, has_healthy) match when any group the analysis ran on matches.
      properties:
        name:
          description: The analysis's name as its record gives it.
          $ref: '#/components/schemas/analysis-query-text'
        medical_condition:
          $ref: '#/components/schemas/analysis-query-medical-condition'
        has_patients:
          $ref: '#/components/schemas/analysis-query-boolean'
        has_healthy:
          $ref: '#/components/schemas/analysis-query-boolean'
        species:
          $ref: '#/components/schemas/analysis-query-text'
        task:
          $ref: '#/components/schemas/analysis-query-normalized'
        spatial_scope:
          $ref: '#/components/schemas/analysis-query-text'
        coordinate_space:
          $ref: '#/components/schemas/analysis-query-text'
        measure_type:
          $ref: '#/components/schemas/analysis-query-text'
        measure_family:
          $ref: '#/components/schemas/analysis-query-text'
        details_type:
          $ref: '#/components/schemas/analysis-query-text'
        is_meta_analysis:
          $ref: '#/components/schemas/analysis-query-boolean'
        n:
          $ref: '#/components/schemas/analysis-query-range'
        has_coordinates:
          $ref: '#/components/schemas/analysis-query-boolean'
        role:
          $ref: '#/components/schemas/analysis-query-text'
        contrast:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            positive:
              $ref: '#/components/schemas/analysis-query-contrast-side'
            negative:
              $ref: '#/components/schemas/analysis-query-contrast-side'
            key:
              description: >
                ns-pond's contrast keys (family|target|baseline), deterministic from the
                record; `:reversed` for the contrast stated the other way round.
              $ref: '#/components/schemas/analysis-query-normalized-ids'
            set:
              description: >
                Contrast sets of one fit; `#n` for the set's stated direction,
                `#n:reversed` for its reversed members.
              $ref: '#/components/schemas/analysis-query-normalized-ids'
            kind:
              $ref: '#/components/schemas/analysis-query-text'
            groups:
              description: between (more than one group) or within (one group).
              $ref: '#/components/schemas/analysis-query-text'
        design:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            allocation:
              $ref: '#/components/schemas/analysis-query-text'
            assignment_structure:
              $ref: '#/components/schemas/analysis-query-text'
            blinding:
              $ref: '#/components/schemas/analysis-query-text'
            arm_kind:
              $ref: '#/components/schemas/analysis-query-text'
            longitudinal:
              $ref: '#/components/schemas/analysis-query-boolean'
        or:
          type: array
          minItems: 2
          description: >
            Sub-queries, any of which may match; each takes this object's criteria. (Not a
            $ref to this schema, which resolvers that inline references cannot expand.)
          items:
            type: object
            additionalProperties: true
    analysis-query-request:
      type: object
      additionalProperties: false
      required:
        - query
      properties:
        query:
          $ref: '#/components/schemas/analysis-query'
        page:
          type: integer
          minimum: 1
          default: 1
          description: Which page of studies to list, in order of paper.
        page_size:
          type: integer
          minimum: 0
          default: 20
          description: >
            How many studies a page lists, each with all its selected analyses; 0 lists
            none.
        paginate:
          type: boolean
          default: true
          description: False lists every selected study, whatever `page` and `page_size` say.
        detail:
          type: string
          enum:
            - studies
            - analyses
            - features
          default: features
          description: >
            How much each listed study carries: `studies` only its ids, `analyses` also its
            selected analyses' ids, names and matches, `features` also their features. With
            `paginate: false`, `studies` lists every selected study's id at once.
        base_study_ids:
          type: array
          items:
            type: string
          description: >
            Only the analyses of these papers. The counts, results and funnel cover the
            same restricted set, so an empty query lists every analysis with features that
            these papers have.
        study_ids:
          type: array
          items:
            type: string
          description: >
            Only the analyses of these studies (the pipeline studies the results name).
            With `base_study_ids`, an analysis must be in both.
        funnel:
          type: boolean
          default: false
          description: >
            Also return `searched` and `funnel`: what each criterion in turn keeps and drops,
            and how many analyses it finds silent. It counts once per criterion, so it costs
            most when criteria keep most analyses.
    analysis-query-result:
      type: object
      properties:
        metadata:
          type: object
          properties:
            total_count:
              type: integer
              description: How many studies the query selects, over every page.
            analysis_count:
              type: integer
              description: How many analyses the query selects, over every page.
        query:
          type: object
          additionalProperties: true
          description: >
            The query in canonical form: a normalized criterion as ids, text, all, none,
            descendants, when_unmapped and when_silent, every other as any/all/none lists.
        searched:
          type: object
          description: With `funnel`, how many analyses and papers have features.
          properties:
            analyses:
              type: integer
            base_studies:
              type: integer
        funnel:
          type: array
          description: With `funnel`, the criteria in order, each with what remains after it.
          items:
            type: object
            properties:
              criterion:
                type: string
              analyses:
                type: integer
              base_studies:
                type: integer
              dropped:
                type: integer
              silent:
                type: integer
                nullable: true
                description: Analyses left by the criteria before this one whose record says nothing on it.
              unmapped:
                type: integer
                nullable: true
                description: >
                  For a normalized criterion, the analyses left by the criteria before this
                  one whose record states the feature but maps none of it.
        results:
          type: array
          description: The page's studies, in order of paper, each with its selected analyses.
          items:
            type: object
            properties:
              study:
                type: string
              base_study:
                type: string
              analyses:
                type: array
                description: Absent when `detail` is `studies`.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      nullable: true
                    matched_by:
                      type: object
                      description: >
                        How the analysis matched each normalized criterion, by its path
                        (`medical_condition`, `or[0].task`): by id, by text, as unmapped or
                        as silent (under `include`). Absent where a mapped analysis matched
                        only through `none`.
                      additionalProperties:
                        type: string
                        enum:
                          - id
                          - text
                          - unmapped
                          - silent
                    features:
                      type: object
                      additionalProperties: true
                      description: >
                        Only when `detail` is `features`. The analysis's display and the
                        `analysis_features` columns its criteria read, named as stored
                        (`is_meta_analysis`, `species`, `task_ids`, `task_family_ids`,
                        `arm_kinds`, `contrast_positive_timepoints`), with the extraction
                        they were read from.
                      properties:
                        config_id:
                          type: string
                          nullable: true
                          description: The pipeline config of the record the features were read from.
                        updated_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: >
                            When the features were last written. Every re-ingest of the
                            paper rewrites them, changed or not.
    query-dataset-list:
      title: query-dataset-list
      type: object
      properties:
        refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: When the datasets were last refreshed.
        results:
          type: array
          items:
            $ref: '#/components/schemas/query-dataset'
    query-dataset:
      title: query-dataset
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        key:
          type: array
          description: The columns that identify a row.
          items:
            type: string
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                  - text
                  - integer
                  - boolean
                  - timestamp
              description:
                type: string
    query-result:
      title: query-result
      type: object
      properties:
        dataset:
          type: string
        query:
          type: object
          description: The query as it was read, one key per `$` parameter given.
          additionalProperties:
            type: string
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
        rows:
          type: array
          description: One array per row, in the order of `columns`.
          items:
            type: array
            items: {}
        limit:
          type: integer
        offset:
          type: integer
        refreshed_at:
          type: string
          format: date-time
          nullable: true
    analysis-term-list:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              label:
                type: string
                nullable: true
              parent:
                type: string
                nullable: true
                description: The term directly above it (a task's or a contrast's family).
              children:
                type: array
                items:
                  type: string
                description: The terms directly under it.
              synonyms:
                type: array
                items:
                  type: string
              analyses:
                type: integer
              base_studies:
                type: integer
    study-schema-upload:
      type: object
      additionalProperties: false
      properties:
        coordinate_parse:
          type: object
          description: A study_schema CoordinateParse (neuroimaging-paper-parse); a revision when revision_of is set.
          additionalProperties: true
        record:
          type: object
          description: A study_schema extraction record (neuroimaging-study-extraction).
          additionalProperties: true
        parsed_paper:
          type: object
          description: The ParsedPaper the parse read, for table captions and the bibliography.
          additionalProperties: true
        text:
          type: string
          description: >
            The parsed paper's text, whose sha256 is the parsed paper's text_sha256. Stored
            as one of the base study's full texts, with the licence of the copy it was read
            from. Needs parsed_paper.
        parse_id:
          type: string
          description: For a record uploaded alone, the parse_id of the stored parse it read.
        base_study_id:
          type: string
          description: The base study; otherwise found by the parse header's identifiers.
        run_id:
          type: string
          description: >
            The caller's id for the pipeline run, stored on each result the upload
            writes. Re-uploading the same documents with the same run_id returns the
            same results and adds none; a run_id that already stored a different
            document for the paper is refused (422).
        pipeline:
          type: object
          description: The pipeline run that produced the record.
          additionalProperties: false
          properties:
            name:
              type: string
              description: Default pondie.
            version:
              type: string
              description: Default the record's extraction_metadata.extractor_version.
            commit:
              type: string
              description: The commit of the code that produced the record. Two commits of one version are different configs.
            runs:
              type: array
              description: >
                The runs that made the record: its record run, and the evidence and
                normalize runs that filled it in, at most one per stage. The record's
                config holds them in stage order with every field present, so uploads made
                by the same runs share one config, and a run of another model, adapter,
                prompt or fit gets another. A rerun with the same model and inputs is the
                same run and joins its config. Without runs the config is keyed as before. Validated by the service (422 SCHEMA,
                DUPLICATE_STAGE, DUPLICATE_RUN_ID, RUN_CONFLICT).
              items:
                $ref: '#/components/schemas/study-schema-run'
    study-schema-run:
      type: object
      description: >
        One run behind a record, as the pipeline's runs table first stored it. A run is
        one combination of model and inputs; reruns of it carry the same run_id and fields.
      properties:
        run_id:
          type: string
          description: Required. Names one run; a run_id stored with other fields is refused (RUN_CONFLICT).
        kind:
          type: string
          nullable: true
          description: model (a model made the output) or migration (an older output carried over).
        stage:
          type: string
          description: Required. record, evidence or normalize.
        source:
          type: string
          description: Required. The record source the run made or read.
        pipeline:
          type: string
          nullable: true
          description: The pipeline that ran the stage.
        version:
          type: string
          nullable: true
          description: The pipeline's version.
        model:
          type: string
          nullable: true
        adapter:
          type: string
          nullable: true
          description: repo@revision of the adapter the model ran with.
        prompt_version:
          type: string
          nullable: true
        schema_version:
          type: string
          nullable: true
        code_commit:
          type: string
          nullable: true
        machine:
          type: string
          nullable: true
        fit:
          type: string
          nullable: true
          description: >
            For a normalize run, the fingerprint of the fitted normalization model (the
            task and contrast clustering) it assigned with. A refit is a new run.
        created_at:
          type: string
          description: Required. When the run was made, ISO 8601.
    study-schema-upload-summary:
      type: object
      description: What one upload changed. Keys appear for the parts uploaded.
      properties:
        kind:
          type: string
          enum: [parse, parse_and_record, record, revision]
        base_study_id:
          type: string
        merged_from:
          type: array
          description: >
            The base study the upload named, and each one between it and base_study_id,
            when it was merged into base_study_id and the upload followed the merge.
            Absent otherwise.
          items:
            type: string
        took_ownership_from:
          type: string
          description: >
            The user who owned the base study before this upload, which leaves it owned by
            no one and public. Absent when no one did.
        study_id:
          type: string
          description: The paper's pipeline-owned study.
        parse_id:
          type: string
        skeleton:
          type: object
          description: For a parse, what it did to the study's analyses.
          properties:
            created:
              type: integer
            updated:
              type: integer
            superseded:
              type: integer
              description: Analyses moved to the history study because this version dropped their key.
            omitted_analyses:
              type: integer
              description: >
                How many text or figure analyses the parse lists as read and left out. Their
                reasons are kept in the study's metadata, not returned here.
            orphaned_claims:
              type: array
              description: >
                Entities that hold claims and stayed on a superseded (history) analysis,
                not copied by a split or merge verdict. A changed name, space or point gives a new
                key, so the new analysis starts with no claims and the old one's are
                reported here. Always present; empty when none.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: The superseded analysis's key.
                  class:
                    type: string
                    description: The entity class.
                  entity_id:
                    type: string
                  claims:
                    type: integer
                    description: How many claims the entity holds.
                  reason:
                    type: string
                    enum: [no_successor, not_carried]
                    description: >
                      Why the claims stayed. not_carried: the upload is a revision and the
                      analysis is neither split nor merged. no_successor: an original
                      parse that no longer holds the key.
        carried:
          $ref: '#/components/schemas/study-schema-carried'
        set_aside_resolved:
          type: array
          description: >
            For a parse: stored records whose set-aside keys (no earlier parse held them)
            this parse holds, re-ingested onto the new entities.
          items:
            type: object
            properties:
              config_id:
                type: string
              keys:
                type: array
                items:
                  type: string
        record:
          type: object
          description: For a record, how its analyses and claims resolved.
          properties:
            config_id:
              type: string
            analyses:
              type: object
              properties:
                resolved:
                  type: integer
                unresolved:
                  type: array
                  description: Keys (or local_ids) that resolve to no analysis; stored as FAILURE rows.
                  items:
                    type: string
                parked:
                  type: array
                  description: Set-aside positional keys, held until a record names them by content.
                  items:
                    $ref: '#/components/schemas/study-schema-set-aside'
                superseded:
                  type: array
                  description: Keys that resolve to history because a revision since split, merged or dropped them.
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      replaced_by:
                        type: array
                        items:
                          type: string
                      reason:
                        type: string
            condition_conflicts:
              type: array
              description: >
                Record analyses whose effect cells set no conditions (the analysis gets none)
                because the cells contradict each other. One entry per record entry, keyed
                by its key, or its local_id when it has none.
              items:
                type: object
                properties:
                  key:
                    type: string
                  cells:
                    type: array
                    items:
                      type: object
                      properties:
                        term:
                          type: string
                        level:
                          type: string
                          description: The cell's level, or its label when it has no level.
                        reason:
                          type: string
                          enum: [both_directions, shared_name]
                          description: >
                            both_directions: a level is given both positive and negative; one
                            conflict per level, even when it appears under two labels.
                            shared_name: two cells would name the same condition.
                        name:
                          type: string
                          description: The condition name the cells share. Only for shared_name.
            claims:
              type: object
              properties:
                created:
                  type: integer
                matched:
                  type: integer
                rejected_paths:
                  type: array
                  items:
                    type: string
                entities:
                  type: object
                  description: The record's entities that were created or matched to stored ones.
                  properties:
                    created:
                      type: integer
                    matched:
                      type: integer
                unlocated:
                  type: array
                  description: Paths of analysis or coordinate-set items that name no content key; they are not stored as entities.
                  items:
                    type: string
                unidentified:
                  type: array
                  description: Paths of entity lists that are not lists, and of their items that are not objects; not stored as entities.
                  items:
                    type: string
                duplicates:
                  type: array
                  description: Paths of items whose hash an earlier item of the record already has (two items naming one content key); not stored.
                  items:
                    type: string
                rename_candidates:
                  type: array
                  description: >
                    Entities the record names differently from a stored sibling of the same
                    class and parent, each the only unmatched one there. They are linked as
                    renamed_by_extractor candidates; claims stay on the old entity until a
                    curator links them.
                    Analyses and coordinate sets are never candidates: a new name is a new key.
                  items:
                    $ref: '#/components/schemas/study-schema-rename-candidate'
                parked_entities:
                  type: array
                  description: >
                    Set-aside entities: positional keys, or keys no stored parse holds
                    (resolved later by a parse that holds them; see set_aside_resolved).
                  items:
                    $ref: '#/components/schemas/study-schema-set-aside'
            carried:
              $ref: '#/components/schemas/study-schema-carried'
        provenance:
          type: object
          description: The stored run behind each part of the upload, keyed parse and record.
          additionalProperties:
            $ref: '#/components/schemas/pipeline-run-provenance'
    study-schema-rename-candidate:
      type: object
      properties:
        class:
          type: string
        from:
          type: string
          description: The old name.
        to:
          type: string
          description: The new name.
        entity_id:
          type: string
          description: The old entity.
        candidate_id:
          type: string
          description: The entity for the new name.
    study-schema-carried:
      type: object
      description: Claims copied to the replacements of split or merged keys.
      properties:
        claims:
          type: integer
    study-schema-set-aside:
      type: object
      properties:
        entity:
          type: string
          description: Class[key] for an entity, or absent for an analysis row.
        key:
          type: string
        reason:
          type: string
    pipeline-run-provenance:
      type: object
      properties:
        result_id:
          type: string
          description: The pipeline-study-result that stores the document.
        config_id:
          type: string
        run_id:
          type: string
          nullable: true
          description: The caller's run id the result was uploaded with.
        pipeline:
          type: string
        version:
          type: string
        commit:
          type: string
          nullable: true
        schema:
          type: object
          description: The study_schema schema the document follows (name, version).
          properties:
            name:
              type: string
            version:
              type: string
        parse_version:
          type: object
          description: The parse's producer (name, version, stage, model, prompt_version).
          additionalProperties: true
        runs:
          type: array
          nullable: true
          description: For a record uploaded with runs, the runs its config holds; null otherwise.
          items:
            $ref: '#/components/schemas/study-schema-run'
        date_executed:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        field:
          type: string
          description: Field name that caused the error
          example: "source"
        code:
          type: string
          description: Machine-readable error code
          example: "INVALID_VALUE"
        message:
          type: string
          description: Human-readable error message
          example: "invalid source, choose from: 'neurostore'"
        context:
          type: object
          description: Additional error context
          additionalProperties: true

    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - status
        - title
        - detail
        - timestamp
        - request_id
      properties:
        status:
          type: integer
          description: HTTP status code
          example: 400
        title:
          type: string
          description: Short, human-readable summary
          example: "Bad Request"
        detail:
          type: string
          description: Human-readable explanation
          example: "The request contains invalid parameters"
        type:
          type: string
          description: URI reference for error type
          default: "about:blank"
        instance:
          type: string
          description: URI reference for specific occurrence
          example: "/api/studies/123"
        errors:
          type: array
          description: Field-specific validation errors
          items:
            $ref: '#/components/schemas/ErrorDetail'
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp
        request_id:
          type: string
          description: Unique request identifier
          example: "a1b2c3d4"

    pipeline:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        study_dependent:
          type: boolean
        ace_compatible:
          type: boolean
        pubget_compatible:
          type: boolean
        derived_from:
          type: string
          nullable: true
    pipeline-list:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/pipeline'
        metadata:
          $ref: '#/components/schemas/metadata'
    pipeline-config:
      type: object
      properties:
        id:
          type: string
        config:
          type: object
    pipeline-config-list:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/pipeline-config'
        metadata:
          $ref: '#/components/schemas/metadata'
    pipeline-study-result-list:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/pipeline-study-result'
        metadata:
          $ref: '#/components/schemas/metadata'
    pipeline-study-result-post:
      oneOf:
        - $ref: '#/components/schemas/pipeline-study-result-search'
        - $ref: '#/components/schemas/pipeline-study-result'
    pipeline-study-result-search:
      type: object
      properties:
        study_ids:
          type: array
          items:
            type: string
      required:
        - study_ids
    pipeline-study-result:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        pipeline_config_id:
          type: string
        base_study_id:
          type: string
        config_id:
          type: string
        date_executed:
          type: string
          format: date-time
        file_inputs:
          type: object
        result_data:
          type: object
        status:
          type: string
      required:
        - id
    studyset-return:
