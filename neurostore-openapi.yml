          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: >
            The body is not a batch: a negative expected_last_seq, or an op that is not an
            object. The error names the rule that failed, not the batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404'
        '409':
          description: >
            The review is not in_progress, expected_last_seq is not the review's last_seq
            (the body carries last_seq), or only some of the batch's client_op_ids are stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The request body is over the review body limit (8 MiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            The batch does not validate (no ops, more ops than the review-ops contract allows, or
            an op outside it), an op cannot be applied, or the record would fail study_schema. Each
            refused op is one error: field ops/<index>, code REJECTED, and
            context with op_index (an integer) and client_op_id. The message names the problem.
            A problem with the batch as a whole has field ops and no op index. Nothing is applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/review/reviews/{id}/export':
