    image-value-summary:
      title: image-value-summary
      x-tags:
        - image
      type: object
      description: >-
        Distribution statistics for the image's voxel values, computed once and stored.
        Present only when image_value_summary=true is requested, and null when the image
        has never been summarized. Counts cover every voxel in the file; the distribution
        fields (min/max/mean/std, percentiles, histogram) cover only the finite, non-zero
        voxels, because neuroimaging maps store their background as zero or nan.
      properties:
        status:
          type: string
          description: SUCCESS when the numbers below are populated, FAILURE when the image could not be read.
          nullable: true
        error:
          type: string
          description: Why the last attempt failed, when status is not SUCCESS.
          nullable: true
        summarizer_version:
          type: integer
          description: Which version of the summarizer produced these numbers.
          nullable: true
        computed_at:
          type: string
          format: date-time
          nullable: true
        source_sha256:
          type: string
          description: SHA-256 of the file that was summarized, so a client can tell whether the numbers still describe the file at url.
          nullable: true
        source_bytes:
          type: integer
          format: int64
          nullable: true
        n_voxels:
          type: integer
          format: int64
          description: Total voxels in the file; the denominator for fraction_nan and fraction_zero.
          nullable: true
        n_values:
          type: integer
          format: int64
          description: Finite, non-zero voxels; the n behind the distribution fields and the denominator for fraction_negative.
          nullable: true
        fraction_nan:
          type: number
          description: Non-finite (nan or inf) voxels over n_voxels.
          nullable: true
        fraction_zero:
          type: number
          description: Exactly-zero voxels over n_voxels.
          nullable: true
        fraction_negative:
          type: number
          description: Negative voxels over n_values. A z or t map with a fraction near zero here is either one-sided or mislabelled.
          nullable: true
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        mean:
          type: number
          nullable: true
        std:
          type: number
          nullable: true
        percentiles:
          type: object
          description: 'Percentile value keyed by probe, e.g. {"0.1": -5.2, "1": -3.1, ... "99.9": 5.8}.'
          additionalProperties:
            type: number
            nullable: true
          nullable: true
        histogram:
          type: object
          description: Equal-width bins over [min, max]. Bin edges are implied by the bounds and the length of counts.
          nullable: true
          properties:
            min:
              type: number
              nullable: true
            max:
              type: number
              nullable: true
            bin_width:
              type: number
              nullable: true
            counts:
              type: array
              items:
                type: integer
            underflow:
              type: integer
              format: int64
              description: Values below min, clipped out of the binned range.
              nullable: true
            overflow:
              type: integer
              format: int64
              description: Values above max, clipped out of the binned range.
              nullable: true
