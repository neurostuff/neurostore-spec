  headers:
    RequestId:
      description: >-
        Correlation id for this request. Echoed from an inbound X-Request-ID
        when one is supplied, otherwise generated. Matches the `request_id` in
        an error body and the id in the server's error log.
      schema:
        type: string
        example: "a1b2c3d4e5f6a7b8"
  responses:
    '404':
      description: Not Found
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                status: 404
                title: "Not Found"
                detail: "The requested URL was not found on the server."
                type: "about:blank"
                timestamp: "2025-01-01T00:00:00Z"
                request_id: "req-1234"
    '422':
      description: Unprocessable Entity
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unprocessable:
              value:
                status: 422
                title: "Unprocessable Entity"
                detail: "The request was well-formed but was unable to be followed due to semantic errors."
                type: "about:blank"
                timestamp: "2025-01-01T00:00:00Z"
                request_id: "req-1234"
                errors: []
  parameters:
    search:
      name: search
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        example: imagin
      description: >-
        Words to find in the name and description. Each word is matched whole
        after English stemming, not as a substring or a prefix. Words must all
        match unless joined by OR; quoted phrases, AND, NOT, a leading `-` and
        parentheses are understood too. A search of digits only is matched
        against the PMID instead, on records that have one.
    sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        default: created_at
      description: Parameter to sort results on
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
      description: page of results
    desc:
      name: desc
      in: query
      required: false
      schema:
        type: boolean
      description: sort results by descending order (as opposed to ascending order)
    page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        maximum: 30000
        exclusiveMaximum: true
        minimum: 1
        format: int32
      description: number of results to show on a page
    nested:
      name: nested
      in: query
      required: false
      schema:
        type: boolean
      description: whether to show the URI to a resource (false) or to embed the object in the response (true)
    summary:
      name: summary
      in: query
      required: false
      schema:
        type: boolean
      description: return a lightweight summary payload with study metadata and per-analysis coordinate counts; incompatible with nested
    source:
      name: source
      in: query
      required: false
      schema:
        type: string
        example: neurostore
        default: neurostore
        enum:
          - neurostore
          - neurovault
          - pubmed
          - neurosynth
          - neuroquery
          - pubget
      description: the source of the resource you would like to filter/copy from
    source_id:
      name: source_id
      in: query
      schema:
        type: string
        example: 1234567890ab
      description: id of the resource you are either filtering/copying on
    copy_annotations:
      name: copy_annotations
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: When cloning a studyset, copy annotations and their notes when true (default).
    name:
      name: name
      in: query
      required: false
      schema:
        type: string
      description: search the name field for a term
    description:
      name: description
      in: query
      required: false
      schema:
        type: string
      description: search description field for a term
    filename:
