openapi: 3.0.0
info:
  title: neurostore api
  version: '1.2'
  description: Create studysets for meta-analysis
  contact:
    name: James D Kent
    email: jamesdkent21@gmail.com
    url: 'https://github.com/jdkent'
servers:
