paths:
  /neurostore-studyset-releases/:
    get:
      summary: GET NeuroStore studyset release list
      tags:
        - store
        - neurostore-studyset-releases
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  metadata:
                    type: object
                    properties:
                      total_count:
                        type: integer
                  results:
                    type: array
                    items:
                      type: object
  /neurostore-studyset-releases/{version}:
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: nightly, latest, or a monthly release in YYYY-MM format.
    get:
      summary: GET NeuroStore studyset release manifest
      tags:
        - store
        - neurostore-studyset-releases
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/404'
  /neurostore-studyset-releases/{version}/download:
    parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: nightly, latest, or a monthly release in YYYY-MM format.
    get:
      summary: Download NeuroStore studyset release tarball
      tags:
        - store
        - neurostore-studyset-releases
      responses:
        '200':
          description: OK
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/404'
  /pipelines/:
    get:
      summary: GET a list of pipelines
      tags:
        - store
        - pipelines
      parameters:
        - $ref: '#/components/parameters/paginate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-list'
    post:
      summary: POST/create a pipeline
      tags:
        - store
        - pipelines
      security:
        - JSON-Web-Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipeline'
      responses:
        '201':
          description: Created
        '401':
          description: Unauthorized - Authentication required
  /pipelines/{id}:
    get:
      summary: GET a pipeline by ID
      tags:
        - store
        - pipelines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline'
    put:
      summary: PUT/update a pipeline by ID
      tags:
        - store
        - pipelines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipeline'
      responses:
        '200':
          description: OK
    delete:
      summary: DELETE a pipeline by ID
      tags:
        - store
        - pipelines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content

  /pipeline-configs/:
    get:
      summary: GET a list of pipeline configs
      tags:
        - store
        - pipeline-configs
      parameters:
        - name: pipeline
          in: query
          description: Filter configs by pipeline name
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline'
        - $ref: '#/components/parameters/paginate'
        - name: has_embeddings
          in: query
          description: Filter configs as whether they have embeddings saved.
          schema:
            type: boolean
        - name: embedding_dimensions
          in: query
          description: Filter configs by number of dimensions in the embeddings.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-config-list'
    post:
      summary: POST/create a pipeline config
      tags:
        - store
        - pipeline-configs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipeline-config'
      responses:
        '201':
          description: Created
  /pipeline-configs/{id}:
    get:
      summary: GET a pipeline config by ID
      tags:
        - store
        - pipeline-configs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-config'
    put:
      summary: PUT/update a pipeline config by ID
      tags:
        - store
        - pipeline-configs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipeline-config'
      responses:
        '200':
          description: OK
    delete:
      summary: DELETE a pipeline config by ID
      tags:
        - store
        - pipeline-configs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content

  /study-schema-uploads/:
    post:
      summary: Store a coordinate parse, a revision, an extraction record, or a parse with its record
      description: >
        Takes study_schema's CoordinateParse (alone, or as a
        revision with revision_of set) and/or an extraction record that read it. Analyses
        are keyed by the parse's content keys (study_schema's ParsedAnalysis.key, from the
        analysis's name, space and points) and stored as Analysis.source_id; a new version
        keeps the analyses it drops as non-public history; a revision's split and merge
        verdicts copy claims to the replacements (carried_from). The documents
        are validated against study_schema's JSON Schema by the service, not here.
        Admin only.
        This is a transaction rather than a resource: one upload is atomic across the
        study, its analyses and points, the claims and the history version it writes, so
        it either lands whole or not at all, which separate resource calls could not
        guarantee. The response's provenance names the stored run behind each part.
      tags:
        - store
        - pipeline-study-results
      security:
        - JSON-Web-Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/study-schema-upload'
      responses:
        '200':
          description: What the upload changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study-schema-upload-summary'
        '400':
          description: >
            The body names no document, or cannot locate its base study. Field error codes:
            MISSING (parse_id for a record uploaded alone; base_study_id for a record
            without a parse), MISMATCH (parse_id differs from the uploaded parse's), and an
            error on coordinate_parse/header/identifiers when a new paper has no doi, pmid
            or pmcid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: >
            Unprocessable. Field error codes: SCHEMA (a document fails study_schema's JSON
            Schema), SCHEMA_VERSION (a document states a schema_version other than the one
            the service is pinned to; every upload of that version gets the same answer),
            TEXT_MISMATCH (text's sha256 is not parsed_paper's text_sha256, or text is sent
            without parsed_paper), KEY_MISMATCH (an analysis key is not the one its name, space and
            points give), DUPLICATE_KEY (two analyses of the parse have one key),
            NOT_CURRENT (a stored parse that is no longer current, or a revision of one),
            UNKNOWN_PARSE (a record's parse_id or a revision's revision_of is not stored
            for the paper), MISSING / UNKNOWN_KEY (a revision's verdicts leave a key out,
            or name a replacement it does not hold), RUN_ID_REUSED (the run_id already
            stored a different document for the paper), SCHEMA / DUPLICATE_STAGE /
            DUPLICATE_RUN_ID (on pipeline/runs: a run lacks run_id, stage, source or
            created_at, names an unknown stage or field, or a stage or run_id is named
            twice, or no run is the record run), RUN_CONFLICT (on pipeline/runs/<i>: the
            run_id is stored with other fields), and STALE_ENTITY_HASHES (on
            base_study_id: the paper's stored entities are hashed under an older entity
            hash version, so the upload is refused until they are rehashed), and
            VERDICT_KEY_NOT_IN_REVISION (on coordinate_parse/verdicts/<i>/key: an accept or
            relabel verdict names a key the revision lacks; distinct from MISSING and
            UNKNOWN_KEY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pipeline-study-results/:
    get:
      summary: GET a list of pipeline run results
      tags:
        - store
        - pipeline-study-results
      parameters:
        - $ref: '#/components/parameters/paginate'
        - name: feature_filter
          in: query
          description: >
            Filter results by feature content. Format: "PipelineName[:version]:field_path=value".
            Examples:
              - "TestPipeline:1.0.0:groups.diagnosis=ADHD" (specific version)
              - "TestPipeline:groups.diagnosis=ADHD" (latest version)

            Field path supports array notation with [], regex search with ~, and comparisons with =, >, <, >=, <=.
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline:1.0.0:groups.diagnosis=ADHD'
        - name: feature_flatten
          in: query
          required: false
          schema:
            type: boolean
        - name: pipeline_config
          in: query
          description: >
            Filter results by pipeline config content. Format: "PipelineName[:version]:config_path=value".
            Examples:
              - "TestPipeline:1.0.0:preprocessing.smoothing=8" (specific version)
              - "TestPipeline:model.type=linear" (latest version)

            Config path supports array notation with [], regex search with ~, and comparisons with =, >, <, >=, <=.
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline:1.0.0:preprocessing.smoothing=8'
        - name: feature_display
          in: query
          description: >
            Filter results by pipeline name and optionally version. Format: "pipeline_name[:version]".
            Examples:
              - "TestPipeline" (all results from pipeline)
              - "TestPipeline:1.0.0" (results from specific version)
            Multiple values can be provided to get results from multiple pipelines/versions.
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline:1.0.0'
        - name: study_id
          in: query
          description: Filter results by base study ID
          required: false
          schema:
            type: array
            items:
              type: string
        - name: version
          in: query
          description: Filter results by pipeline config version
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-study-result-list'
    post:
      summary: POST/create a pipeline run result
      tags:
        - store
        - pipeline-study-results
      parameters:
        - $ref: '#/components/parameters/paginate'
        - name: feature_filter
          in: query
          description: >
            Filter results by feature content. Format: "PipelineName[:version]:field_path=value".
            Examples:
              - "TestPipeline:1.0.0:groups.diagnosis=ADHD" (specific version)
              - "TestPipeline:groups.diagnosis=ADHD" (latest version)

            Field path supports array notation with [], regex search with ~, and comparisons with =, >, <, >=, <=.
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline:1.0.0:groups.diagnosis=ADHD'
        - name: feature_flatten
          in: query
          required: false
          schema:
            type: boolean
        - name: pipeline_config
          in: query
          description: >
            Filter results by pipeline config content. Format: "PipelineName[:version]:config_path=value".
            Examples:
              - "TestPipeline:1.0.0:preprocessing.smoothing=8" (specific version)
              - "TestPipeline:model.type=linear" (latest version)

            Config path supports array notation with [], regex search with ~, and comparisons with =, >, <, >=, <=.
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline:1.0.0:preprocessing.smoothing=8'
        - name: feature_display
          in: query
          description: >
            Filter results by pipeline name and optionally version. Format: "pipeline_name[:version]".
            Examples:
              - "TestPipeline" (all results from pipeline)
              - "TestPipeline:1.0.0" (results from specific version)
            Multiple values can be provided to get results from multiple pipelines/versions.
          required: false
          schema:
            type: array
            items:
              type: string
              example: 'TestPipeline:1.0.0'
        - name: study_id
          in: query
          description: Filter results by base study ID
          required: false
          schema:
            type: array
            items:
              type: string
        - name: version
          in: query
          description: Filter results by pipeline config version
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipeline-study-result-post'
            # No description here, matching base-studies pattern
      responses:
        '201':
          description: Created
        '200':
          description: OK (search results)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-study-result-list'
  /pipeline-study-results/{pipeline_study_result_id}:
    get:
      summary: GET a pipeline run result by ID
      tags:
        - store
        - pipeline-study-results
      parameters:
        - name: pipeline_study_result_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pipeline-study-result'
    put:
      summary: PUT/update a pipeline run result by ID
      tags:
        - store
        - pipeline-study-results
      parameters:
        - name: pipeline_study_result_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/pipeline-study-result'
      responses:
        '200':
          description: OK
    delete:
      summary: DELETE a pipeline run result by ID
      tags:
        - store
        - pipeline-study-results
      parameters:
        - name: pipeline_study_result_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /studysets/:
    get:
      summary: GET a list of studysets
      tags:
        - store
        - studysets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/studyset-list'
      description: Get a list of studysets.
      parameters:
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/desc'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/paginate'
        - $ref: '#/components/parameters/nested'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/description'
        - $ref: '#/components/parameters/authors'
        - $ref: '#/components/parameters/user_id'
      security:
        - JSON-Web-Token: []
        - {}
    post:
      summary: POST/create a studyset
      parameters:
        - $ref: '#/components/parameters/source_id'
        - $ref: '#/components/parameters/source'
        - $ref: '#/components/parameters/copy_annotations'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/studyset-return'
      tags:
        - store
        - studysets
      description: Create a studyset. When `source_id` is provided, Neurostore clones an existing studyset owned by any user into a new studyset owned by the caller, copying studies and (by default) annotations.
      security:
        - JSON-Web-Token: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/studyset-request'
  '/studysets/{id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
    get:
      security:
        - JSON-Web-Token: []
        - {}
      summary: GET a studyset
      tags:
        - store
        - studysets
      responses:
        '200':
          description: studyset found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/studyset-return'
              examples: {}
            application/gzip:
              schema:
                type: object
                properties: {}
        '404':
          $ref: '#/components/responses/404'
      description: Retrieve the information of a studyset with the matching studyset ID.
      parameters:
        - $ref: '#/components/parameters/nested'
        - $ref: '#/components/parameters/summary'
        - $ref: '#/components/parameters/gzip'
    put:
      summary: PUT/update a studyset
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/studyset-return'
        '422':
          $ref: '#/components/responses/422'
      description: Update a studyset.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/studyset-request'
      tags:
        - store
        - studysets
      security:
        - JSON-Web-Token: []
    delete:
      summary: DELETE a studyset
      responses:
        '200':
          description: OK
      description: delete a studyset
      security:
        - JSON-Web-Token: []
      tags:
        - store
        - studysets
  /studies/:
    get:
      summary: GET a list of studies
      tags:
        - store
        - studies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study-list'
              examples: {}
      description: List studies
      parameters:
        - $ref: '#/components/parameters/data_sources'
        - $ref: '#/components/parameters/journal_id'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/desc'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/paginate'
        - $ref: '#/components/parameters/nested'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/description'
        - $ref: '#/components/parameters/source_id'
        - $ref: '#/components/parameters/unique'
        - $ref: '#/components/parameters/source'
        - $ref: '#/components/parameters/authors'
        - $ref: '#/components/parameters/user_id'
        - $ref: '#/components/parameters/data_type'
        - $ref: '#/components/parameters/role'
        - $ref: '#/components/parameters/map_type'
        - $ref: '#/components/parameters/studyset_owner'
        - $ref: '#/components/parameters/level'
        - $ref: '#/components/parameters/pmid'
        - $ref: '#/components/parameters/doi'
        - $ref: '#/components/parameters/flat'
        - $ref: '#/components/parameters/image_metadata'
        - $ref: '#/components/parameters/image_value_summary'
      security:
        - JSON-Web-Token: []
        - {}
    parameters: []
    post:
      summary: POST/create a study
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study-return'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/study-request'
        description: ''
      tags:
        - store
        - studies
      description: Create a study
      security:
        - JSON-Web-Token: []
      parameters:
        - $ref: '#/components/parameters/source'
        - $ref: '#/components/parameters/source_id'
  '/studies/{id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
    get:
      security:
        - JSON-Web-Token: []
        - {}
      summary: GET a study
      tags:
        - store
        - studies
      responses:
        '200':
          description: Study Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study-return'
              examples: {}
        '404':
          $ref: '#/components/responses/404'
      description: Get a study.
      parameters:
        - $ref: '#/components/parameters/data_sources'
        - $ref: '#/components/parameters/nested'
        - $ref: '#/components/parameters/studyset_owner'
        - $ref: '#/components/parameters/flat'
        - $ref: '#/components/parameters/image_metadata'
        - $ref: '#/components/parameters/image_value_summary'
    put:
      summary: PUT/update a study
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/study-return'
        '422':
          $ref: '#/components/responses/422'
      description: Update a study.
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/study-request'
      tags:
        - store
        - studies
      security:
        - JSON-Web-Token: []
    delete:
      summary: DELETE a study
      responses:
        '200':
          description: OK
      description: delete a study
      security:
        - JSON-Web-Token: []
      tags:
        - store
        - studies
  /analyses/:
    get:
      security:
        - JSON-Web-Token: []
        - {}
      summary: GET list of analyses
      tags:
        - store
        - analyses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analysis-list'
              examples: {}
      description: List all analyses performed across studies.
      parameters:
        - $ref: '#/components/parameters/data_sources'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/desc'
        - $ref: '#/components/parameters/page_size'
        - $ref: '#/components/parameters/paginate'
        - name: study
          in: query
          required: false
          description: Filter tables by study id
          schema:
            type: string
        - $ref: '#/components/parameters/role'
        - $ref: '#/components/parameters/name'
        - $ref: '#/components/parameters/nested'
        - $ref: '#/components/parameters/image_metadata'
        - $ref: '#/components/parameters/image_value_summary'
    parameters: []
    post:
      summary: POST/create an analysis
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analysis-return'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/analysis-request'
      tags:
        - store
        - analyses
      description: create an analysis
      parameters: []
      security:
        - JSON-Web-Token: []
  '/analyses/{id}':
    parameters:
      - schema:
          type: string
        name: id
        in: path
        required: true
    get:
      security:
        - JSON-Web-Token: []
        - {}
      summary: GET an analysis
      tags:
