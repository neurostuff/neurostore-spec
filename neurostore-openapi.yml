      description: >
        Any reviewer may export any review. The zip holds the paper's documents and text, the
        review's record, its coordinate revision when it has one (each analysis's verdict taken
        from the review's provenance, a rejected analysis written as omit), and its ops in seq
        order. The record is never changed by the export; run/provenance/<id>.json beside it
        names the review, its state, whether it was reviewed and whether its record was edited,
        and the source record it derives from.
        The whole zip is built in memory before the response is sent.
      tags:
        - review
      security:
        - JSON-Web-Token: []
      responses:
        '200':
          description: A zip of the review's layout
          headers:
            Content-Disposition:
              description: An attachment named review-<id>.zip
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/404'
        '422':
          description: The paper of a review's source has no article_id, so it cannot be exported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
